name: release-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      # The engine is embedded in the executable, so it has to exist before the
      # Rust build reads src-tauri/resources.
      - name: Package the embedded course engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller keyring pypdf faster-whisper
          python -m PyInstaller --noconfirm --clean --onefile --name bbc-course-agent --paths . `
            --collect-all keyring --collect-all pypdf --collect-all faster_whisper agent/entrypoint.py
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item -Force dist/bbc-course-agent.exe src-tauri/resources/bbc-course-agent.exe
      - name: Build the Windows portable executable
        run: npm run desktop:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-English-Windows-portable
          path: src-tauri/target/release/clear-english.exe
          if-no-files-found: error
