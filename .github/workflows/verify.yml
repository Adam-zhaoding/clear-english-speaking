name: verify

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Compile the pipeline
        run: python -m compileall -q scripts probe

      # The pipeline imports requests / bs4 / pypdf / faster-whisper lazily so
      # that a missing dependency reports itself clearly instead of crashing on
      # import. Argument parsing must therefore work on a bare interpreter.
      - name: The CLI must load without the optional dependencies
        run: |
          python scripts/make_lesson.py --help
          python scripts/make_lesson.py prepare --help
          python scripts/make_lesson.py build --help

      - name: The player must render and stay self-contained
        run: python scripts/selftest_render.py
