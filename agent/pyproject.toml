[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbc-course-agent"
version = "0.1.0"
description = "Local companion service for Clear English Speaking"
requires-python = ">=3.11"

[project.scripts]
bbc-course-agent = "bbc_course_agent.__main__:main"

[tool.setuptools]
packages = ["bbc_course_agent"]
